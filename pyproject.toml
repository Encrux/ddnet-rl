[project]
name = "ddnet-rl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.2.0",
    "tensorboard>=2.14.0",
    "numba>=0.59.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
