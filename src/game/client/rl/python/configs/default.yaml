# Default training config (Ryzen 5800X3D / RTX 3080)
# Usage: python train.py --config configs/default.yaml
# CLI args override any value here.

# Environment
server_side: true
num_servers: 12
num_envs: 127
map: Tutorial
frame_skip: 3
max_episode_steps: 2000

# Training
total_timesteps: 20000000000
num_steps: 128
num_minibatches: 64
update_epochs: 4
sync_update: true
checkpoint_respawn: true

# PPO
learning_rate: 3.0e-4
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

# Network
use_cnn: true
hidden_dim: 256
num_layers: 2
n_player_state_stack: 4
n_frame_stack: 1

# Logging
save_freq: 100
log_freq: 10
